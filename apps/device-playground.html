<style>
/* Layout: 部屋タブ → 左に機器の場面(SVG)とグラフ、右に操作パネル・原理・ノート。単一のダーク作業場テーマ */
:root{
  color-scheme:dark;
  --bg:#191d20;--bench:#22282c;--ink:#ebe7de;--muted:#98a2a6;--line:#343c41;
  --accent:#ff8a1f;--live:#ffc061;--bad:#ff4b3a;--ok:#5fd46e;--cool:#5fb0ff;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-seg:"Share Tech Mono","JetBrains Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;background-image:radial-gradient(1200px 700px at 30% 20%,#262d31 0%,var(--bg) 70%)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;max-width:1520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-family:var(--f-body);font-weight:500;font-size:28px;margin:0;line-height:1;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--accent)}
a.back{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:#2b3236;border:1px solid #3d474d;border-radius:8px;padding:7px 12px;text-decoration:none;box-shadow:0 2px 0 #0d1012;white-space:nowrap}a.back:hover{background:#333b40}a.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rooms{display:flex;flex-wrap:wrap;gap:6px}
nav.rooms button{font:inherit;font-weight:700;font-size:13px;background:#22292d;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 14px;cursor:pointer}
nav.rooms button[aria-current="true"]{background:#3a2a16;border-color:#b06c2a;color:#ffe0b8}
nav.rooms button:disabled{opacity:.45;cursor:not-allowed}
#outDev button:disabled,#hs:disabled,#weldTest:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--bench);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{font-family:var(--f-body);font-weight:500;font-size:16px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 span{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.scene{position:relative;background:#2a3034;border-radius:14px;padding:10px;box-shadow:0 2px 0 #353b3e,0 6px 0 #23282b,0 24px 40px rgba(0,0,0,.45)}
.scene svg{display:block;width:100%;height:auto;border-radius:8px;user-select:none;-webkit-user-select:none}
.scene-zoom{display:none}
@media(max-width:1050px){
  .main>.col{display:contents}
  .graph-card{order:1}
  .prin{order:2}
  .notes-card{order:3}
}
@media(max-width:700px){
  .scene-zoom{display:block}
  .scene{overflow:auto}
  .scene-zoom:has(input:checked)+.scene svg{min-width:800px}
  .seg{flex-wrap:wrap;max-width:100%;box-sizing:border-box}
  .keys,.leds{flex-wrap:wrap}
}
.say{font-size:14px;line-height:1.65;background:#15191b;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 12px;min-height:3.2em}
.say.warn{border-left-color:var(--bad);background:#2a1513}
.broken{display:none;background:#3a1210;border:1px solid #a02a20;border-radius:10px;padding:12px 14px;line-height:1.7}
.broken.show{display:block}
.broken b.t{font-family:var(--f-body);font-weight:500;font-size:18px;color:#ffb3a8;display:block;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--muted);min-width:5.5em}
.seg{display:inline-flex;border:1px solid #3d474d;border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:700;background:#2b3236;color:var(--muted);border:0;padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid #3d474d}
.seg button[aria-pressed="true"]{background:#4a3a22;color:#ffd9a8}
.btn{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:#2b3236;border:1px solid #3d474d;border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 2px 0 #0d1012}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #0d1012}
.btn.go{background:#1f5a2c;border-color:#2f8a43}
.btn.stop{background:#6a1a14;border-color:#a02a20}
.btn.warn{border-color:#8a5a2a;color:#ffd0a0}
.btn[aria-pressed="true"]{background:#5a2a10;border-color:#ff8a1f;color:#ffd0a0}
#solAState,#solBState{display:inline-block;width:3ch;font-family:var(--f-mono);text-align:center}
#comp,.air-sol-single{min-width:8em}
#pwr{width:14em;max-width:100%;flex-shrink:0}
#airPowerStatus{display:inline-block;width:8em;flex-shrink:0}
input[type=range]{accent-color:var(--accent);width:140px}
.val{font-family:var(--f-mono);font-weight:700;min-width:4.5em;text-align:right}
.ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.heater-reading{padding:10px 12px;background:#14181a;border-radius:6px}
.heater-reading small{display:block;margin-top:4px;color:var(--muted);line-height:1.5}
#heaterTemp{font:500 24px var(--f-mono)}
.device{background:linear-gradient(#3a4146,#2c3236);border:1px solid #4a5258;border-radius:10px;padding:12px;box-shadow:inset 0 1px 0 #59626a}
.device .name{font-family:var(--f-mono);font-size:11px;color:#b8c0c4;letter-spacing:.08em;margin-bottom:6px;display:flex;justify-content:space-between}
.lcd{background:#0d1210;border-radius:6px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;font-family:var(--f-seg)}
.lcd .k{font-size:11px;color:#7d8a84;font-family:var(--f-mono)}
.lcd .pv{font-size:40px;color:#ff5a3c;text-align:right;line-height:1;text-shadow:0 0 8px rgba(255,90,60,.5)}
.lcd .sv{font-size:24px;color:#5dff8a;text-align:right;line-height:1;text-shadow:0 0 6px rgba(93,255,138,.4)}
.lcd .u{font-size:13px;color:#7d8a84}
.leds{display:flex;gap:12px;margin-top:8px;font-family:var(--f-mono);font-size:11px;color:#b8c0c4}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3b2a1a;margin-right:4px;vertical-align:-1px}
.led.on{background:#ffa21f;box-shadow:0 0 8px #ffa21f}
.led.g.on{background:#39e05a;box-shadow:0 0 8px #39e05a}
.led.r.on{background:#ff3b2b;box-shadow:0 0 8px #ff3b2b}
.keys{display:flex;gap:6px;margin-top:8px}
.keys button{font:inherit;font-family:var(--f-mono);font-weight:700;background:#1d2225;color:#dfe5e8;border:1px solid #4a5258;border-radius:6px;padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 #0d1012}
.keys button:active{transform:translateY(1px);box-shadow:none}
.graph{background:#101416;border-radius:10px;border:1px solid var(--line)}
.graph canvas{display:block;width:100%;height:auto}
.graph canvas.motor-graph{min-height:190px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.prin p{margin:0 0 8px;font-size:13px;line-height:1.75;color:#d6d9d4}
.prin .big{font-family:var(--f-mono);font-size:20px;color:var(--live);font-weight:700}
.prin .tag{display:inline-block;font-size:11px;background:#3a2a16;color:#ffd9a8;border-radius:4px;padding:0 6px;margin-right:6px}
.prin .fig{background:#f3f0e7;border-radius:8px;padding:6px;margin:6px 0 10px}
.prin .fig svg,.prin .fig canvas{display:block;width:100%;height:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.cmp th{color:var(--muted);font-weight:700}
.normal-readings{padding:10px 12px;background:#14181a;border-radius:6px}
.normal-readings h4{margin:0 0 6px;font-size:14px;font-weight:500}
.normal-readings p{margin:6px 0;font-size:12px;color:var(--muted)}
.normal-readings th{font-weight:500}
.normal-readings td:nth-child(2),.normal-readings td:nth-child(3){white-space:nowrap}
.normal-readings #normalPower{color:var(--accent)}
.table-scroll{overflow-x:auto}
.meter{height:8px;background:#14181a;border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.notes li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;line-height:1.5;color:var(--muted)}
.notes li .st{width:20px;height:20px;border-radius:50%;border:2px dashed #4a545a;display:grid;place-items:center;font-size:11px;font-weight:700}
.notes li.got{color:var(--ink)}
.notes li.got .st{border:2px solid var(--accent);background:#3a2814;color:var(--live)}
.notes li.got.brk .st{border-color:var(--bad);background:#3a1210;color:#ffb3a8}
.notes .hint{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.notes li.new{animation:pop .8s}
@keyframes pop{0%{background:#4a3214}100%{background:transparent}}
.count{font-family:var(--f-mono);color:var(--live)}
.note-files{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.note-files small{flex-basis:100%;color:var(--muted)}
.note-files #noteStatus:empty{display:none}
.svgt{font-family:var(--f-body);font-weight:700;pointer-events:none}
.svgm{font-family:var(--f-mono);font-weight:700;pointer-events:none}
@media (prefers-reduced-motion:reduce){.notes li.new{animation:none}}

.sponsor{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:18px 22px;border:1px solid #b06c2a;border-left:5px solid var(--accent);border-radius:12px;background:linear-gradient(110deg,#382919,#22282c 75%)}
.sponsor-brand{display:flex;flex-direction:column;gap:3px}
.sponsor-brand small{font-size:11px;color:#c9b69d}
.sponsor-brand strong{font:700 27px var(--f-body);letter-spacing:.04em;color:#ffe0b8}
.sponsor-copy{flex:1;min-width:200px}
.sponsor-copy p{margin:0;color:var(--ink);font-weight:700;font-size:16px}
.sponsor-copy small{display:block;margin-top:5px;color:#c5c7c2;line-height:1.6}
.sponsor-cta{display:inline-block;padding:12px 16px;border-radius:8px;background:var(--accent);color:#211407;font-weight:700;text-decoration:none;text-align:center}
.sponsor-cta:hover{background:#ffb054}
.sponsor-cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:600px){.sponsor{padding:16px;gap:12px}.sponsor-copy{flex-basis:100%;min-width:0}.sponsor-cta{width:100%}}
</style>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const scene=$('scene'),gc=$('graph'),gx=gc.getContext('2d');
function drawLabel(ctx,value,...position){ctx.fillText(window.lessonLanguage?.text(value)??value,...position);}
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,a={}){const f=a.fill;delete a.fill;const t=el('text',Object.assign({x,y},a),p);if(f)t.style.fill=f;t.textContent=s;return t;}
function box3d(g,x,y,w,h,d,front,top,side,extra={}){const dx=d*.55,dy=d*.8;
  el('polygon',{points:`${x},${y} ${x+w},${y} ${x+w+dx},${y-dy} ${x+dx},${y-dy}`,fill:top},g);
  el('polygon',{points:`${x+w},${y} ${x+w+dx},${y-dy} ${x+w+dx},${y+h-dy} ${x+w},${y+h}`,fill:side},g);
  return el('rect',Object.assign({x,y,width:w,height:h,fill:front},extra),g);}
function say(h,w){$('say').innerHTML=h;$('say').classList.toggle('warn',!!w);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 音 ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noise(len,freq,gain){const a=AC;if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*len),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,5);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  const g=a.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(a.destination);s.start(t);}
const sClick=()=>noise(.03,3000,.8), sTick=()=>noise(.02,5000,.4);
let hum=null;
function humSet(f,g){if(!AC)return;if(!hum){hum={o:AC.createOscillator(),g:AC.createGain(),f:AC.createBiquadFilter()};hum.o.type='sawtooth';hum.f.type='lowpass';hum.f.frequency.value=600;hum.g.gain.value=0;hum.o.connect(hum.f).connect(hum.g).connect(AC.destination);hum.o.start();}
  hum.o.frequency.value=Math.max(20,f);hum.g.gain.value=g;}

/* ---------- ノート ---------- */
const NOTES=[
 ['onoff','温度','ON/OFF制御では、HYSがあっても余熱や検出の遅れで水温が上下することがある'],
 ['pid','温度','PID制御でヒーターを入れる時間の割合を調整し、水温を目標近くに保てた'],
 ['ice','温度','氷を入れても、温調器が自動でヒーターを強めて元の温度に戻す'],
 ['tcrev','温度','K熱電対を選んだとき、+と−を逆につなぐと、温度が上がっているのに下がって見える'],
 ['boil','温度','100℃で沸騰。それ以上は温度が上がらず、水が減っていく'],
 ['weld','温度','【故障】接点の溶着を再現。温調器がOFFを指令しても、リレーの接点が開かない','b'],
 ['ssr','温度','【故障】SSRの過熱:放熱板なしで大きな電流を流し続けて焼けた','b'],
 ['dry','温度','【故障】空焚き:水がないのにヒーターを入れて焼き切れた','b'],
 ['dol','モーター','直入れ始動は、定格の約6倍の大電流が一瞬流れる'],
 ['star','モーター','スター結線で始動すると、電流は直入れの約1/3になる'],
 ['stuck','モーター','スターでは力も1/3。重い荷物だと回りきれない'],
 ['inv','モーター','インバータは周波数をゆっくり上げるので、始動電流が小さい'],
 ['rev','モーター','三相の線を2本入れ替えると、モーターが逆に回る'],
 ['oc','モーター','加速時間が短すぎると、インバータが過電流(OC)で止まる'],
 ['ov','モーター','重い物を急に減速すると、インバータが過電圧(OV)で止まる'],
 ['sdshort','モーター','【故障】インターロックなしでスターとデルタが同時に入り短絡','b'],
 ['invwire','モーター','【故障】電源をインバータの出力側(U・V・W)につないで破損','b'],
 ['burn','モーター','【故障】短い間隔でON/OFF（始動・停止）を繰り返し、モーターが焼損','b'],
 ['acv','測る','この教材のコンセントは交流100V。交流はV~(交流電圧)で測る'],
 ['trans','測る','トランスの2次側は24V。巻数の比(500:120)で電圧が下がる'],
 ['iso','測る','ブレーカーを切って1次・2次間をΩで測るとOL。巻線どうしは導通しない'],
 ['mode','測る','交流をV⎓で、直流をV~で測ると、このテスターでは正しい電圧を読めない'],
 ['pol','測る','直流で赤と黒を逆に当てると、マイナスの値になる'],
 ['swv','測る','切れているスイッチの両端には、電源の電圧(24V)がかかる'],
 ['amp','測る','電流は回路を切って、その間にテスターを入れて(直列で)測る'],
 ['ohm','測る','抵抗は電源を切ってから測る。Pt100は温度で抵抗が変わる'],

const got=new Set();
const saveDiscovery=setupNotebook('device',NOTES,got,renderNotes);
function renderNotes(nk){const ul=$('notes');ul.innerHTML='';
  NOTES.filter(n=>n[1]===ROOM.tag).forEach(([k,,t,b])=>{const li=document.createElement('li');const g=got.has(k);
    li.className=(g?'got':'')+(b?' brk':'')+(k===nk?' new':'');
    const hint=k==='onoff'?'<small class="hint">「温度の部屋」を押して初期状態に戻し、時間を10倍速に。約20秒待って「目標付近を拡大」をON。水を抜いたり、熱電対を逆接続したりしないで観察します。</small>':'';
    li.innerHTML=`<span class="st">${g?(b?'!':'✓'):''}</span><span>${t}${hint}</span>`;ul.appendChild(li);});
  const mine=NOTES.filter(n=>n[1]===ROOM.tag);$('cnt').textContent=mine.filter(n=>got.has(n[0])).length+' / '+mine.length;}
function found(k){if(got.has(k)||!saveDiscovery(k))return;renderNotes(k);}

/* ---------- 故障 ---------- */
let BROKEN=null;
function breakIt(key,title,why){
  if(BROKEN)return;BROKEN={key};found(key);
  $('broken').innerHTML=`<b class="t">故障! ${title}</b>${why}<div class="row" style="margin-top:8px"><button class="btn" id="fix">部品を交換して直す</button></div>`;
  $('broken').classList.add('show');
  $('fix').addEventListener('click',()=>{BROKEN=null;$('broken').classList.remove('show');ROOM.repair();say('部品を交換しました。');});
}
let smokes=[];
function smoke(x,y){for(let i=0;i<14;i++)smokes.push({x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*.02,vy:-.03-Math.random()*.04,r:6+Math.random()*8,life:0,max:1600+Math.random()*1200});}
let smokeG=null;
function drawSmoke(dt){if(!smokeG)return;smokeG.innerHTML='';
  if(BROKEN&&BROKEN.at&&Math.random()<dt*.012)smoke(BROKEN.at[0],BROKEN.at[1]);
  smokes=smokes.filter(s=>{s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=dt*.012;if(s.life>s.max)return false;
    el('circle',{cx:s.x,cy:s.y,r:s.r,fill:'#6b6b6b',opacity:(1-s.life/s.max)*.55},smokeG);return true;});}

/* ---------- UI部品 ---------- */
function seg(id,opts,cur,on){return `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;}
function bindSeg(id,fn){$(id).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ac();$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v);}));}
function slider(id,min,max,step,val,fmt){return `<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="val" id="${id}V">${fmt(val)}</span>`;}
function bindSlider(id,fmt,fn){$(id).addEventListener('input',e=>{const v=+e.target.value;$(id+'V').textContent=fmt(v);fn(v);});}

  if(ROOM===WIRE&&WIRE.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)WIRE.step(dt/1000/n);}
  if(ROOM===PROT&&PROT.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)PROT.step(dt/1000/n);}
  if(ROOM===AIR&&AIR.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)AIR.step(dt/1000/n);}
  if(ROOM===SENS&&SENS.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)SENS.step(dt/1000/n);}
  if(ROOM===LEAK&&LEAK.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)LEAK.step(dt/1000/n);}
  if(ROOM===MOTOR&&MOTOR.st){const n=Math.max(1,Math.ceil(dt/10));for(let i=0;i<n;i++)MOTOR.step(dt/1000/n);}
  ROOM.render(dt);drawSmoke(dt);requestAnimationFrame(loop);}
window.__dbg=()=>ROOM.st;
load(TEMP);requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
})();
